name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer (PowerShell 7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run PSScriptAnalyzer (incl. 5.1/7.0 syntax compatibility)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./SOA-Manager.ps1, ./src -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error, Warning
          if ($results.Count -gt 0) {
              $results | Format-Table RuleName, ScriptName, Line, Message -AutoSize | Out-String | Write-Host
              throw "PSScriptAnalyzer reported $($results.Count) finding(s)."
          }
          Write-Host 'PSScriptAnalyzer: clean.'

  parse-ps51:
    name: Parse check (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse with the Windows PowerShell 5.1 engine
        shell: powershell
        run: |
          Write-Host "Engine: $($PSVersionTable.PSVersion)"
          $files = @("$PWD\SOA-Manager.ps1") + (Get-ChildItem "$PWD\src\*.ps1" | ForEach-Object FullName)
          $failed = 0
          foreach ($file in $files) {
              $errs = $null; $tokens = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errs)
              if ($errs.Count -gt 0) {
                  $failed++
                  $errs | ForEach-Object { Write-Host ("{0} L{1}: {2}" -f (Split-Path $file -Leaf), $_.Extent.StartLineNumber, $_.Message) }
              }
          }
          if ($failed -gt 0) { throw "Parse errors under Windows PowerShell 5.1 in $failed file(s)." }
          Write-Host 'Parse OK under Windows PowerShell 5.1.'

  parse-ps7:
    name: Parse check (PowerShell 7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse with the PowerShell 7 engine
        shell: pwsh
        run: |
          Write-Host "Engine: $($PSVersionTable.PSVersion)"
          $files = @("$PWD/SOA-Manager.ps1") + (Get-ChildItem "$PWD/src/*.ps1" | ForEach-Object FullName)
          $failed = 0
          foreach ($file in $files) {
              $errs = $null; $tokens = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errs)
              if ($errs.Count -gt 0) {
                  $failed++
                  $errs | ForEach-Object { Write-Host ("{0} L{1}: {2}" -f (Split-Path $file -Leaf), $_.Extent.StartLineNumber, $_.Message) }
              }
          }
          if ($failed -gt 0) { throw "Parse errors under PowerShell 7 in $failed file(s)." }
          Write-Host 'Parse OK under PowerShell 7.'
