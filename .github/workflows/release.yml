name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build release zip
        run: |
          stage="Exchange-SOA-Manager-${GITHUB_REF_NAME}"
          mkdir "$stage"
          cp SOA-Manager.ps1 Launch-SOA-Manager.bat README.md LICENSE CHANGELOG.md "$stage/"
          zip -r "${stage}.zip" "$stage"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" Exchange-SOA-Manager-*.zip --clobber \
            || gh release create "$GITHUB_REF_NAME" Exchange-SOA-Manager-*.zip --generate-notes
