name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build release zip
        run: |
          stage="Exchange-SOA-Manager-${GITHUB_REF_NAME}"
          mkdir "$stage"
          cp SOA-Manager.ps1 Launch-SOA-Manager.bat README.md LICENSE CHANGELOG.md "$stage/"
          zip -r "${stage}.zip" "$stage"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: Exchange-SOA-Manager-*.zip
